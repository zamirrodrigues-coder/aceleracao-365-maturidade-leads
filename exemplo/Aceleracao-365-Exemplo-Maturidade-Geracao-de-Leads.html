<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exemplo: Maturidade da Geração de Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,700;0,800;1,800&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg0: #0b1422; --bg1: #0f1c30; --panel: #13223a; --panel2: #182b47;
    --line: rgba(201,162,75,.28); --line2: rgba(255,255,255,.08);
    --ink: #EAEEF4; --muted: #8c99ad;
    --gold: #C9A24B; --gold2: #E7C56C; --golddk: #A9863B;
    --silver: #C7CDD6; --silver2: #EDEFF3; --silverdk: #93a0b2;
    --green: #56c08a; --red: #e0756a;
    --fdisp: 'Archivo','Trebuchet MS',system-ui,sans-serif;
    --fbody: 'Public Sans','Calibri',system-ui,sans-serif;
    --gold-grad: linear-gradient(135deg,var(--gold2),var(--gold) 55%,var(--golddk));
    --silver-grad: linear-gradient(135deg,var(--silver2),var(--silver) 55%,var(--silverdk));
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      repeating-linear-gradient(-45deg, rgba(201,162,75,.04) 0, rgba(201,162,75,.04) 1px, transparent 1px, transparent 90px),
      radial-gradient(120% 90% at 85% 0%, #1b2d49 0%, #0f1c30 45%, #0b1422 100%);
    background-color: #0b1422;
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--fbody);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; position: sticky; top: 0; z-index: 20; background: linear-gradient(rgba(11,20,34,.92), rgba(11,20,34,0)); backdrop-filter: blur(6px); }
  .topbar .nm { font-family: var(--fdisp); font-weight: 800; font-size: 14px; letter-spacing: .5px; }
  .topbar .nm .y { font-style: italic; }
  .topbar .sp { margin-left: auto; font-size: 12px; color: var(--muted); }
  .gold-text { background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .silver-text { background: var(--silver-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  main { flex: 1; padding: 6px 16px 40px; }

  h1 { font-family: var(--fdisp); font-weight: 800; font-size: 26px; line-height: 1.12; margin: .2em 0 .1em; text-wrap: balance; }
  h2 { font-family: var(--fdisp); font-weight: 800; font-size: 19px; margin: 0 0 2px; }
  h3 { font-family: var(--fdisp); font-weight: 700; font-size: 15px; margin: 0 0 4px; }
  .eyebrow { font-family: var(--fdisp); text-transform: uppercase; letter-spacing: 2.5px; font-size: 11px; font-weight: 700; color: var(--gold2); }
  .sub { color: var(--muted); font-size: 15px; margin: 0; }

  .blochead { display: flex; align-items: center; gap: 10px; margin: 22px 0 12px; }
  .blochead .bar { width: 4px; height: 22px; border-radius: 3px; background: var(--gold-grad); flex: 0 0 auto; }
  .blochead .lbl { font-family: var(--fdisp); font-weight: 800; font-size: 15.5px; letter-spacing: .3px; }
  .blochead .bc { margin-left: auto; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: #0b1422; background: var(--gold-grad); border-radius: 999px; padding: 3px 10px; }

  .block { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .block .bn { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-family: var(--fdisp); font-weight: 800; font-size: 14px; color: #0b1422; background: var(--gold-grad); flex: 0 0 auto; }
  .block.done .bn { background: var(--silver-grad); }
  .block .bt { font-family: var(--fdisp); font-weight: 700; font-size: 14.5px; }
  .block .bs { font-size: 12px; color: var(--muted); }
  .block.hot { border-color: var(--gold); background: linear-gradient(180deg, rgba(201,162,75,.17), var(--panel)); box-shadow: 0 3px 16px rgba(201,162,75,.14); }
  .block.hot .bn { box-shadow: 0 0 0 3px rgba(201,162,75,.22); }
  .block.hot .bt { font-size: 15.5px; }
  .block.parado { cursor: default; }

  .pill { margin-left: auto; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.ok { color: var(--green); border: 1px solid rgba(86,192,138,.4); }
  .pill.now { color: #0b1422; background: var(--gold-grad); }
  .pill.soon { color: var(--muted); border: 1px solid var(--line2); }

  .lesson { background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 14px 16px; margin: 10px 0; }
  .lesson h3 { color: var(--gold2); }
  .lesson p { margin: 6px 0 0; font-size: 14px; }
  .lesson ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
  .lesson li { margin: 5px 0; }
  .mom { margin: 22px 0 6px; font-family: var(--fdisp); font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .mom b { color: var(--gold2); }
  .aqui { font-size: 12px; color: var(--muted); margin: 0; }
  .nums { display: flex; gap: 10px; margin-top: 4px; }
  .nums div { flex: 1; text-align: center; padding: 6px 0; }
  .nums .v { font-family: var(--fdisp); font-weight: 800; font-size: 30px; color: var(--ink); line-height: 1.1; }
  .nums .m .v { color: var(--gold2); }
  .nums .r { font-size: 12px; color: var(--muted); }
  .tem { list-style: none; padding: 0 !important; }
  .tem li { padding-left: 22px; position: relative; }
  .tem li::before { content: "✓"; position: absolute; left: 2px; color: var(--green); font-weight: 700; }
  .rodape { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line2); font-size: 12.5px; color: var(--muted); }
  .rodape .pill { margin-left: 0; }
  .aten { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line2); font-size: 14px; }
  .aten:last-of-type { border-bottom: 0; }
  .aten b { display: block; }
  .aten .t { color: var(--muted); font-size: 13px; }
  .aten .pill { align-self: center; }
  .lesson.foco { border-color: var(--gold); background: linear-gradient(180deg, rgba(201,162,75,.17), var(--panel)); box-shadow: 0 3px 16px rgba(201,162,75,.14); }
  .lesson.foco p + p { margin-top: 8px; }
  .lesson.foco .et { font-size: 12px; color: var(--gold2); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; margin-top: 6px; }
  .lesson.foco h3.acao { font-size: 19px; color: var(--ink); margin-top: 2px; }
  details.camada { margin-top: 14px; border: 1px solid var(--line2); border-radius: 14px; padding: 12px 16px; background: var(--panel); }
  details.camada summary { cursor: pointer; font-weight: 700; color: var(--gold2); }
  details.camada h4 { margin: 16px 0 4px; font-size: 13px; color: var(--gold2); }
  details.camada .falta { font-size: 12.5px; color: var(--muted); margin: -4px 0 6px 30px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { flex: 1 1 auto; text-align: center; border: 1.5px solid var(--line2); background: rgba(0,0,0,.18); color: var(--ink); border-radius: 11px; padding: 10px 8px; font: inherit; font-weight: 600; font-size: 13.5px; cursor: pointer; transition: .15s; }
  .chip[aria-pressed="true"] { border-color: var(--gold); background: rgba(201,162,75,.14); color: var(--gold2); }
  .chips.duas .chip { flex: 1 1 calc(50% - 4px); }
  .chip small { display: block; margin-top: 1px; font-weight: 400; font-size: 11px; color: var(--muted); }
  .chips.lista .chip { flex: 1 1 100%; text-align: left; padding: 11px 13px; }

  .btn { font-family: var(--fdisp); font-weight: 700; font-size: 15.5px; border-radius: 13px; padding: 14px 16px; cursor: pointer; border: 1.5px solid transparent; width: 100%; text-align: center; color: #0b1422; background: var(--gold-grad); display: block; margin-top: 10px; text-decoration: none; }
  .btn.outline { background: transparent; color: var(--gold2); border-color: var(--line); }
  .btn.ghost { background: transparent; color: var(--muted); border-color: var(--line2); }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }

  .out { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; margin-top: 12px; }
  .out .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .out .big { font-family: var(--fdisp); font-weight: 800; font-size: 30px; color: var(--gold2); margin-top: 3px; }
  .outnote { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .scrimline { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; }

  .passos { display: flex; gap: 4px; margin: 14px 0 6px; }
  .passos span { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); }
  .passos span.ok { background: var(--golddk); }
  .passos span.at { background: var(--gold2); }
  .trilha { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; margin: 8px 0 14px; font-size: 12.5px; color: var(--muted); }
  .trilha a { color: var(--gold2); text-decoration: none; font-weight: 600; }
  .lista { margin-top: 14px; }
  #painel { scroll-margin-top: 58px; padding-top: 8px; }
  .res { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line2); font-size: 13.5px; }
  .res .num { flex: none; width: 22px; color: var(--muted); font-weight: 700; }
  .res .val { margin-left: auto; font-weight: 700; color: var(--gold2); white-space: nowrap; }
  .res .val.longo { white-space: normal; text-align: right; max-width: 60%; }
  .f { margin: 13px 0; }
  .f .rot { display: block; font-weight: 600; font-size: 14px; margin-bottom: 5px; }
  .f .hint { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; }
  .campo { display: flex; align-items: stretch; gap: 10px; }
  .campo > input { flex: 1; }
  input.num { width: 100%; min-width: 0; font: inherit; color: var(--ink); background: rgba(0,0,0,.22); border: 1.5px solid var(--line2); border-radius: 11px; padding: 11px 13px; outline: none; transition: border-color .15s; }
  input.num:focus { border-color: var(--gold); }
  input.num:disabled { opacity: .45; }
  .pre { flex: 1; display: flex; min-width: 0; }
  .pre .tag { font-weight: 700; color: var(--muted); background: rgba(0,0,0,.25); border: 1.5px solid var(--line2); border-right: 0; border-radius: 11px 0 0 11px; padding: 11px 10px; white-space: nowrap; }
  .pre input.num { border-radius: 0 11px 11px 0; }
  .pos { flex: 1; display: flex; min-width: 0; }
  .pos .tag { font-weight: 700; color: var(--muted); background: rgba(0,0,0,.25); border: 1.5px solid var(--line2); border-left: 0; border-radius: 0 11px 11px 0; padding: 11px 12px; white-space: nowrap; }
  .pos input.num { border-radius: 11px 0 0 11px; }
  .ns { flex: none; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .ns input { width: 18px; height: 18px; accent-color: var(--gold); }
  .orig { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .orig .chip { flex: none; padding: 6px 12px; font-size: 12.5px; }
  .grade2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .grade2 .out { margin-top: 0; }
  .grade2 .out .big { font-size: 21px; }
  .grade2 .out.larga { grid-column: 1 / -1; }
  /* Ficha do mentor em cada etapa */
  .ficha .fi { padding-top: 9px; }
  .ficha .fi + .fi { margin-top: 9px; border-top: 1px solid var(--line2); }
  .ficha .fi > b { display: block; font-family: var(--fdisp); font-size: 12.5px; color: var(--muted); }
  .ficha .fi p, .ficha .fi ul { margin-top: 3px; }
  .ficha .fi.ent p { color: var(--gold2); font-weight: 600; }
  .lesson p.perg { font-size: 15px; font-weight: 700; }
  .lesson p.apoio { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .trilha b { color: var(--ink); font-weight: 600; }
  .caminho .nome { display: flex; align-items: center; gap: 8px; }
  .etiqueta { display: inline-block; margin-left: 8px; padding: 2px 8px; border: 1px solid var(--line2); border-radius: 999px; font: 700 10px/1.4 var(--fbody); letter-spacing: .5px; text-transform: uppercase; color: var(--muted); vertical-align: middle; }
  .aviso { color: var(--gold2); font-size: 12.5px; margin: 8px 0 0; }
  .lesson p.cita { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--line); }
  .feito { margin-left: 8px; font-size: 11px; font-weight: 700; color: var(--green); white-space: nowrap; }
  .caminho { background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
  .caminho.melhor { border-color: var(--gold); background: linear-gradient(180deg, rgba(201,162,75,.17), var(--panel)); }
  .caminho .nome { font-family: var(--fdisp); font-weight: 700; font-size: 14.5px; }
  .caminho .det { font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  /* Devolutiva de cada tela: o que a resposta significa para o aluno */
  .lesson.dev { border-color: var(--line); }
  .lesson.dev p + p { margin-top: 8px; }
  .barras { margin-top: 10px; }
  .barras .it { padding: 5px 0; font-size: 13.5px; }
  .barras .it + .it { border-top: 1px solid var(--line2); }
  .barras .l { display: flex; justify-content: space-between; gap: 10px; }
  .barras .barra { height: 6px; border-radius: 4px; background: var(--line); margin-top: 3px; }
  .barras .barra i { display: block; height: 6px; border-radius: 4px; background: var(--gold2); }
  .subcampo { margin: -4px 0 12px 18px; padding: 2px 0 6px 14px; border-left: 2px solid var(--line); }
  .subcampo .f { margin: 4px 0 0; }
  .perg2 { margin: 22px 0 0; font-size: 17px; }

  /* Ponto de interrogação ao lado de cada termo */
  .q { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; margin-left: 7px; padding: 0; vertical-align: middle; border-radius: 50%; border: 1.5px solid var(--line); background: rgba(201,162,75,.1); color: var(--gold2); font: 700 13px/1 var(--fdisp); cursor: pointer; }
  .q:hover { background: rgba(201,162,75,.24); }
  h1 .q { position: relative; top: -3px; }
  .qi { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: 6px; border-radius: 50%; border: 1.5px solid var(--line); color: var(--gold2); font: 700 11px/1 var(--fdisp); vertical-align: middle; }
  .nometermo { display: flex; align-items: center; flex-wrap: wrap; margin: 10px 0 0; font-size: 13.5px; color: var(--muted); }
  .nometermo b { color: var(--ink); margin-left: 4px; }
  .lesson h3 .q { margin-left: 8px; }

  /* Opções com termo e explicação */
  .opcao { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line2); border-radius: 14px; padding: 4px 12px 4px 4px; margin-bottom: 10px; }
  .opcao.sel { border-color: var(--gold); background: linear-gradient(180deg, rgba(201,162,75,.17), var(--panel)); }
  .opcao .alvo { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; background: none; border: 0; border-radius: 10px; padding: 8px 10px; font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .opcao .bt { display: block; font-family: var(--fdisp); font-weight: 700; font-size: 14.5px; }
  .opcao .bs { display: block; font-size: 12px; color: var(--muted); }
  .marca { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,.22); display: grid; place-items: center; font-size: 14px; font-weight: 700; line-height: 1; color: #0b1422; }
  .marca.bola { border-radius: 50%; }
  .opcao.sel .marca { background: var(--gold-grad); border-color: transparent; }
  .grupo { display: flex; align-items: center; margin: 18px 0 8px; font-family: var(--fdisp); font-weight: 700; font-size: 14.5px; }
  .chipsq { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .chipq { display: flex; align-items: center; min-width: 0; border: 1.5px solid var(--line2); background: rgba(0,0,0,.18); border-radius: 11px; padding-right: 8px; }
  .chipq.sel { border-color: var(--gold); background: rgba(201,162,75,.14); }
  .chipq .alvo { flex: 1; min-width: 0; background: none; border: 0; border-radius: 9px; color: var(--ink); font: inherit; font-weight: 600; font-size: 13px; text-align: left; padding: 10px 4px 10px 11px; cursor: pointer; }
  .chipq.sel .alvo { color: var(--gold2); }
  .chipq .q { margin-left: 2px; }
  .rotl { display: flex; align-items: center; }
  .rotl .rot { margin-bottom: 0; }
  .f .hint { margin: 2px 0 0; }
  .f .campo { margin-top: 7px; }
  .res > span:nth-child(2) { display: flex; align-items: center; flex-wrap: wrap; }

  /* Folha que sobe com a explicação do termo */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 30; }
  .folha { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; display: flex; justify-content: center; }
  .folha-in { width: 100%; max-width: 560px; max-height: 82vh; overflow-y: auto; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 18px 18px 22px; box-shadow: 0 -10px 40px rgba(0,0,0,.45); }
  .folha-in p { margin: 8px 0 0; font-size: 14.5px; }
  .folha-in h3 { margin: 14px 0 0; color: var(--gold2); }
  .folha-in ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
  .folha-in ol { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
  .folha-in li { margin: 5px 0; }

  .reveal { animation: rise .4s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise { 0% { opacity: 0; transform: translateY(12px); } 100% { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="nm"><span class="silver-text">ACELERAÇÃO</span> <span class="gold-text y">365</span></div>
    <div class="sp">Exemplo de navegação</div>
  </div>
  <main id="main"></main>
</div>

<script>
(function () {
  var OBJ = {
    "receita-nova": {
      nome: "Receita Nova", ic: "🆕", resumo: "Dinheiro de quem compra pela primeira vez",
      exp: "É a receita que vem de clientes novos. É aqui que a geração de leads trabalha: sem contato novo, não há cliente novo. Quanto mais clara a meta, mais fácil escolher o pilar e o canal.",
      dicas: ["Defina quantos clientes novos a meta pede por mês.", "Descreva o cliente ideal em uma frase: quem é e que problema resolve.", "Separe a meta de cliente novo da meta de recompra."],
      af: "Tenho uma meta mensal de clientes novos.",
      pilares: ["inbound", "outbound", "branding", "indicacao"]
    },
    "expansao": {
      nome: "Expansão", ic: "📈", resumo: "Dinheiro de quem já é cliente",
      exp: "É a receita que vem de quem já comprou. Custa menos do que conquistar um cliente novo, porque a confiança já existe. O trabalho é lembrar, oferecer o próximo passo e reativar quem parou.",
      dicas: ["Reúna no CRM os clientes ativos, com a data da última compra.", "Defina o que mais cada cliente poderia comprar.", "Reserve uma ação por mês só para a base."],
      af: "Tenho uma meta mensal de vendas para quem já é cliente.",
      pilares: ["base"]
    }
  };

  var PILAR = {
    "inbound": {
      nome: "Inbound", ic: "🧲", resumo: "O cliente vem",
      exp: "No Inbound, é o cliente que procura e encontra a sua empresa. Você aparece quando ele pesquisa, vê um anúncio ou passa na frente da loja. Funciona melhor quando a pessoa já sabe que tem o problema e está buscando quem resolva.",
      dicas: ["Comece por onde o cliente já procura: o Google.", "Tenha um lugar pronto para receber o interessado: página, WhatsApp ou telefone.", "Pergunte a cada contato de qual canal ele veio e registre a resposta, de preferência no CRM."],
      af: "O cliente encontra a minha empresa quando procura o que eu vendo.",
      canais: ["google-ads", "meta-ads", "seo", "geo", "google-meu-negocio", "avaliacoes-google", "oferta-de-entrada", "ponto-fisico"],
      conv: {

      passos: ["Pense nos contatos que pediram preço ou prazo no último mês.", "Veja como a empresa decidiu que estavam prontos.", "Veja se a regra está escrita e se o CRM tem uma etapa para isso."] },
    "onde-criterio": { nome: "O Critério Escrito", olho: "Onde Conferir",

      passos: ["Abra o documento ou o CRM em que o critério está escrito.", "Veja se ele diz o perfil e o sinal de interesse do MQL.", "Veja se ele diz o que quem vende confirma para chamar de SQL."] },
    "onde-medir": { nome: "O Acompanhamento do Canal", olho: "Onde Conferir",

      passos: ["Pense no último mês.", "Veja se alguém olhou o que cada canal trouxe, e onde olhou.", "Veja se saiu dali alguma decisão."] },
    "onde-relatorio": { nome: "O Relatório do Mês", olho: "Onde Conferir",
      exp: "É o que o CRM mostra de um mês, separado por canal.",
      passos: ["Abra no CRM a área de relatórios. O nome dela muda de um CRM para outro.", "Filtre o último mês e separe por origem ou canal.", "Veja se aparecem contatos, MQL, SQL e clientes de cada canal."] },
    "onde-decisao": { nome: "A Última Decisão", olho: "Onde Conferir",
      exp: "É o que mudou em um canal por causa do número: mais esforço, um ajuste ou o corte.",
      passos: ["Pense na última vez que abriu o relatório.", "Lembre o que mudou em algum canal depois disso.", "Veja a data dessa mudança."] },
    "onde-relacionamento": { nome: "Quem Não Comprou", olho: "Onde Conferir",
      exp: "Cadência é a sequência combinada de contatos com quem ainda não comprou.",
      passos: ["Pense em quem falou com a empresa no último mês e não comprou.", "Veja se essas pessoas receberam retorno, e de quem.", "Veja se o retorno segue uma sequência escrita, ou se depende de alguém lembrar."] },
    "onde-proxima-acao": { nome: "Próxima Ação", olho: "Onde Conferir",

      passos: ["Abra no CRM a lista de contatos em aberto: quem ainda não comprou e não foi encerrado.", "Veja quantos têm uma próxima ação com data.", "Compare com o total da lista."] },
    "onde-em-aberto": { nome: "Contatos em Aberto", olho: "Onde Conferir",

    "onde-contato": { nome: "O Registro do Contato", olho: "Onde Conferir",

      passos: ["Abra o lugar onde a empresa guarda os contatos.", "Procure as pessoas que falaram com a empresa nesta semana.", "Veja se cada uma está lá, com o canal de origem e o nome de quem cuida dela."] },
    "onde-teste-contato": { nome: "Teste do Contato Novo", olho: "Onde Conferir",
      exp: "Mostra se um contato de verdade entra no CRM, sem ninguém avisar que é um teste.",
      passos: ["Mande uma mensagem de outro número, como um cliente novo.", "Espere até o dia seguinte.", "Procure esse número no CRM e veja se entrou, com origem e responsável."] },
    "onde-contatos": { nome: "Contatos por Mês", olho: "Onde Conferir",
      exp: "Contato é quem se interessou e falou com a empresa, por qualquer meio.",
      passos: ["Com CRM: tire o relatório de contatos novos dos três últimos meses completos e divida por três. Hoje são {meses}.", "Sem CRM: some as conversas novas, as ligações e as visitas desses meses, divida por três e marque Estimado."] },
    "onde-com-origem": { nome: "Contatos com Origem e Responsável", olho: "Onde Conferir",
      exp: "Mostra quantos contatos dão para medir e para cobrar. Origem preenchida sozinha pelo sistema não conta.",
      passos: ["No CRM, tire a lista de contatos novos dos três últimos meses completos. Hoje são {meses}.", "Conte os que têm canal de origem e responsável preenchidos.", "Divida por três."] },
    "onde-percentual": { nome: "Percentual sobre o Ano Passado", olho: "Onde Conferir", nota: NOTA_GOOGLE,
      exp: "O Google compara o período escolhido com os mesmos meses do ano passado.",
      passos: ["Siga o caminho do número que você acabou de informar, com o Período só nos três últimos meses completos.", "Logo abaixo do número, veja o percentual. O sinal de mais quer dizer que subiu, e o de menos, que caiu.", "Se o mês atual estiver no período, o Google não mostra o percentual."] },
    "onde-ads-no-ar": { nome: "Anúncios no Ar", olho: "Onde Conferir", nota: NOTA_ADS,
      exp: "Mostra se os anúncios rodaram em todos os dias do último mês completo.",
      passos: [CONTA_ADS, "No menu, clique em Campanhas.", "No seletor de período, no canto de cima, à direita, escolha o mês passado.", "No gráfico, veja se há dias sem custo. Dia sem custo é dia sem anúncio.", "Se parou, veja em Faturamento se o saldo acabou e em Anúncios se algum foi reprovado."] },
    "onde-ads-termos": { nome: "Termos de Pesquisa", olho: "Onde Conferir", nota: NOTA_ADS,
      exp: "São as pesquisas que fizeram o seu anúncio aparecer. O Google mostra as que foram feitas por um número significativo de pessoas, e não todas.",
      passos: [CONTA_ADS, "Clique em Campanhas, depois em Insights e relatórios e em Termos de pesquisa.", "No seletor de período, escolha o mês passado e ordene pela coluna Cliques.", "Leia os dez primeiros, ou todos, se forem menos. Não tem a ver a busca de quem quer outra coisa: outro serviço, emprego, curso, algo grátis ou o nome de outra empresa.", "Na campanha Performance Max, escolha no menu da mesma tela a opção dos termos de pesquisa. Na campanha Inteligente, abra o cartão Temas de palavras-chave e Relatório de termos de pesquisa."] },
    "onde-ads-custo": { nome: "Investimento", olho: "Onde Conferir", nota: NOTA_ADS,
      exp: "É o que o Google cobrou pelos anúncios no período.",
      passos: [CONTA_ADS, "Clique em Campanhas.", "No seletor de período, escolha só os três últimos meses completos. Hoje são {meses}.", "Copie o total da coluna Custo."] },
    "onde-ads-cliques": { nome: "Cliques", olho: "Onde Conferir", nota: NOTA_ADS,
      exp: "É quantas vezes alguém tocou no anúncio e foi para a página.",
      passos: [CONTA_ADS, "Clique em Campanhas, com os mesmos três meses no período.", "Copie o total da coluna Cliques."] },
    "onde-ads-conversao": { nome: "Conversão Principal", olho: "Onde Conferir", nota: NOTA_ADS,
      exp: "Conversão é o que a conta conta como resultado do anúncio. As ações principais são as que entram na coluna Conversões e nos lances.",
      passos: [CONTA_ADS, "Clique em Metas, depois em Conversões e em Resumo.", "Veja as ações marcadas como Principal e o que cada uma conta: o contato do CRM, o formulário enviado, a ligação ou o toque em um botão.", "Se houver mais de uma principal, marque a mais simples."] },
    "onde-ads-principais": { nome: "Ações Principais", olho: "Onde Conferir", nota: NOTA_ADS,
      exp: "Quando várias ações são principais, o mesmo contato pode contar mais de uma vez.",
      passos: [CONTA_ADS, "Clique em Metas, depois em Conversões e em Resumo.", "Conte as ações marcadas como Principal. As marcadas como Secundária não entram nessa conta."] },
    "onde-ads-conversoes": { nome: "Conversões", olho: "Onde Conferir", nota: NOTA_ADS,
      exp: "É quantas vezes uma ação principal aconteceu depois de um clique no anúncio.",
      passos: [CONTA_ADS, "Clique em Campanhas e deixe no período os três últimos meses completos. Hoje são {meses}.", "Copie o total da coluna Conversões."] },
    "onde-ads-pagina": { nome: "Teste da Página", olho: "Onde Conferir", nota: NOTA_TESTE,
      exp: "Mostra se quem chega à página do anúncio consegue falar com você.",
      passos: ["No Google Ads, clique em Campanhas, depois em Insights e relatórios e em Páginas de destino.", "Veja qual página recebeu mais cliques nos três últimos meses completos.", "Abra essa página no celular pelo endereço, sem pesquisar o anúncio no Google. Para ver o anúncio, o Google indica a Ferramenta de diagnóstico e visualização de anúncios.", "Tente falar com a empresa. Se abrir uma conversa, leia o número dígito a dígito: vale o número, não o nome exibido."] },
    "onde-ads-crm": { nome: "Contatos com a Origem Google Ads", olho: "Onde Conferir",

    "onde-meta-no-ar": { nome: "Anúncios no Ar", olho: "Onde Conferir", nota: NOTA_META,
      exp: "Mostra se os anúncios rodaram em todos os dias do último mês completo.",
      passos: [CONTA_META, "Em Campanhas, no menu de data no alto da tabela, escolha o mês passado.", "Veja a coluna Veiculação. Depois, em Ver gráficos, veja o valor usado de cada dia. Dia sem valor usado é dia sem anúncio.", "Se for post turbinado, abra o Meta Business Suite, depois Insights e Anúncios, e veja as colunas Status e Valor usado.", "Se parou, veja em Cobrança e pagamentos, na Atividade de pagamento, se o saldo acabou ou se o pagamento falhou."] },
    "onde-meta-resultado": { nome: "O Que o Painel Conta", olho: "Onde Conferir", nota: NOTA_META,

    "onde-meta-valor": { nome: "Valor Usado", olho: "Onde Conferir", nota: NOTA_META,

    "onde-meta-resultados": { nome: "Resultados", olho: "Onde Conferir", nota: NOTA_META,

    "onde-meta-destino": { nome: "Para Onde o Anúncio Leva", olho: "Onde Conferir", nota: NOTA_META,

      passos: [CONTA_META, "Abra o conjunto de anúncios que mais usou verba.", "Veja o Local da conversão, que diz para onde o anúncio leva."] },
    "onde-meta-conversa": { nome: "Teste da Conversa", olho: "Onde Conferir", nota: NOTA_TESTE,
      exp: "Mostra se quem toca no anúncio chega a quem atende.",
      passos: ["Pegue um celular que não seja o da empresa.", "Mande uma mensagem para o WhatsApp, o Direct ou o Messenger do anúncio, como um cliente novo. Para ver o anúncio, procure a empresa na Biblioteca de Anúncios, que qualquer pessoa pode abrir.", "Leia o número ou o perfil que respondeu, dígito a dígito: vale o número, não o nome exibido.", "Repita fora do horário e veja o que a pessoa recebe."] },
    "onde-meta-leads": { nome: "Cadastros do Formulário", olho: "Onde Conferir", nota: NOTA_META,

    "onde-meta-site": { nome: "Teste da Página", olho: "Onde Conferir", nota: NOTA_TESTE,

    "onde-meta-crm": { nome: "Contatos com a Origem Meta", olho: "Onde Conferir",
      exp: "Mostra quantos contatos do anúncio entraram no CRM com essa origem.",
      passos: ["No CRM, tire a lista de contatos novos dos três últimos meses completos. Hoje são {meses}.", "Conte os que têm a origem Meta preenchida.", "Divida por três."] },
    "onde-seo-console": { nome: "Search Console", olho: "Onde Conferir", nota: NOTA_SEO,
      exp: "É a ferramenta gratuita do Google que mostra para quais buscas o site aparece, quantas vezes e quantos cliques teve. Os dados começam a ser coletados quando o site é adicionado e levam alguns dias para aparecer.",
      passos: ["Pergunte a quem cuida do site se ele está no Search Console.", "Quem adicionou o site é o proprietário e pode dar acesso a você, em Configurações, Usuários e permissões.", "Se ninguém adicionou, adicione o site e confirme que ele é seu."] },
    "onde-seo-buscas": { nome: "Consultas sem o Nome da Empresa", olho: "Onde Conferir", nota: NOTA_SEO,
      exp: "São as buscas que fizeram o site aparecer, tirando as que têm o nome da empresa. Para proteger a privacidade, o Google deixa algumas consultas de fora da lista.",
      passos: [CONTA_SEO, "Abra o Relatório de Performance.", "No filtro de data, escolha os três últimos meses completos. Hoje são {meses}.", "Clique em + Adicionar filtro, depois em Consultas e em Consultas sem. Digite o nome da empresa como as pessoas escrevem e clique em Aplicar. Se aparecer a opção Sem marca, ela faz o mesmo.", "Na guia Consultas, ordene pela coluna Cliques e leia as dez primeiras."] },
    "onde-seo-pagina": { nome: "Inspeção de URL", olho: "Onde Conferir", nota: NOTA_SEO,
      exp: "Mostra se uma página está no índice do Google. Com O URL está no Google, a página pode aparecer na busca, mas não há garantia.",

    "onde-seo-impressoes": { nome: "Impressões", olho: "Onde Conferir", nota: NOTA_SEO,
      exp: "É quantas vezes o site apareceu nos resultados da busca.",
      passos: [CONTA_SEO, "No Relatório de Performance, deixe os três últimos meses completos e o filtro Consultas sem o nome da empresa. Hoje são {meses}.", "Copie o total de Impressões."] },
    "onde-seo-cliques": { nome: "Cliques", olho: "Onde Conferir", nota: NOTA_SEO,
      exp: "É quantas vezes alguém clicou no site a partir da busca.",
      passos: [CONTA_SEO, "Na mesma tela, com o mesmo período e o mesmo filtro.", "Copie o total de Cliques."] },
    "onde-seo-teste": { nome: "Teste da Página", olho: "Onde Conferir", nota: NOTA_TESTE,
      exp: "Mostra se quem chega à página pela busca consegue falar com você.",
      passos: ["No Search Console, abra o Relatório de Performance, escolha a guia Páginas e ordene pela coluna Cliques.", "Abra a primeira página no celular pelo endereço. Sem o Search Console, use a página do seu serviço principal.", "Tente falar com a empresa. Se abrir uma conversa, leia o número dígito a dígito: vale o número, não o nome exibido."] },
    "onde-seo-crm": { nome: "Contatos com a Origem SEO", olho: "Onde Conferir",
      exp: "Mostra quantos contatos que vieram da busca entraram no CRM com essa origem.",
      passos: ["No CRM, tire a lista de contatos novos dos três últimos meses completos. Hoje são {meses}.", "Conte os que têm a origem SEO preenchida.", "Divida por três."] },
    "onde-geo-robos": { nome: "Arquivo robots.txt", olho: "Onde Conferir", nota: NOTA_GEO,
      exp: "É o arquivo que diz quais robôs podem entrar no site. Cada IA tem um robô de busca, que decide se o site entra nas respostas: Googlebot, OAI-SearchBot, Bingbot, PerplexityBot, Claude-SearchBot e Applebot. Os robôs de treino são outros e têm pergunta própria.",
      passos: ["No navegador, digite o endereço do seu site seguido de /robots.txt. Exemplo: suaempresa.com.br/robots.txt.", "Se aparecer uma página de erro, o arquivo não existe, e nada está bloqueado.", "Procure as linhas User-agent. Está bloqueado o robô que tem logo abaixo a linha Disallow: /, com a barra sozinha.", "Olhe os nomes Googlebot, OAI-SearchBot, Bingbot, PerplexityBot, Claude-SearchBot e Applebot. A linha User-agent: * vale para todos.", "Se não souber ler, peça a quem cuida do site."] },
    "onde-geo-igual": { nome: "Ficha no Google e Site", olho: "Onde Conferir", nota: NOTA_GEO,
      exp: "O Google recomenda manter o Perfil da Empresa atualizado. Nenhuma fonte oficial diz que a igualdade entre a ficha e o site decide a citação, por isso este ponto é um ajuste.",
      passos: ["Abra a sua ficha no Google e, ao lado, o rodapé ou a página de contato do site.", "Compare nome, telefone, endereço e horário.", "Vale a letra e o número: um telefone antigo já é diferença."] },
    "onde-geo-visitas": { nome: "Visitas do Assistente de IA", olho: "Onde Conferir", nota: NOTA_GEO,
      exp: "O Analytics tem o canal Assistente de IA, com as visitas vindas de ferramentas como ChatGPT, Gemini e Copilot. Os links do ChatGPT trazem utm_source=chatgpt.com. As Visões Gerais criadas por IA e o Modo IA ficam em Pesquisa orgânica.",
      passos: ["Entre no Google Analytics com a conta do site.", "Clique em Relatórios, Aquisição e Aquisição de tráfego.", "Escolha no período os três últimos meses completos. Hoje são {meses}.", "Procure a linha Assistente de IA e copie o número de sessões."] },
    "onde-geo-teste": { nome: "Perguntar a uma IA", olho: "Onde Conferir", nota: NOTA_TESTE,
      exp: "A resposta muda conforme o lugar, as memórias da conta e o jeito de perguntar. Por isso o teste só informa.",
      passos: ["Abra o ChatGPT e o Gemini.", "Pergunte pelo seu serviço na sua cidade, sem dizer o nome da empresa.", "Veja se a empresa aparece e se a informação está certa.", "Se você usa o Bing Webmaster Tools, o relatório AI Performance mostra quantas vezes o site foi citado no Copilot."] },
    "onde-geo-pagina": { nome: "Teste da Página", olho: "Onde Conferir", nota: NOTA_TESTE,
      exp: "Mostra se quem chega à página por uma IA consegue falar com você.",
      passos: ["Na resposta da IA, veja qual página do site ela citou. Sem citação, use a página inicial.", "Abra essa página no celular pelo endereço.", "Tente falar com a empresa. Se abrir uma conversa, leia o número dígito a dígito: vale o número, não o nome exibido."] },
    "onde-geo-crm": { nome: "Contatos com a Origem GEO", olho: "Onde Conferir",
      exp: "Mostra quantos contatos que conheceram a empresa por uma inteligência artificial entraram no CRM com essa origem.",
      passos: ["No CRM, tire a lista de contatos novos dos três últimos meses completos. Hoje são {meses}.", "Conte os que têm a origem GEO preenchida.", "Divida por três.", "Quem lê a resposta da IA e liga direto não deixa rastro no site. Pergunte a todo contato novo como conheceu a empresa."] },
    "onde-geo-controle": { nome: "Recursos de IA no Search Console", olho: "Onde Conferir", nota: NOTA_GEO,
      exp: "O Search Console tem uma configuração que inclui ou exclui o site das Visões Gerais criadas por IA, do Modo IA e da IA do Discover, de uma vez. Excluir não tira o site da Pesquisa e não é sinal de ranqueamento.",
      passos: ["Entre no Search Console com a conta do site.", "Abra Configurações.", "Procure a configuração de IA generativa da Pesquisa e veja se o site está incluído. O nome em português pode ser outro: a ajuda foi lida em inglês.", "Sem o Search Console, adicione o site primeiro."] },
    "onde-geo-texto": { nome: "Serviço em Texto", olho: "Onde Conferir", nota: NOTA_GEO,
      exp: "O Google pede o conteúdo importante em texto e diz que não é preciso marcação especial nem arquivo para IA.",
      passos: ["Abra no celular a página do serviço principal.", "Procure, escritos em texto, o serviço, a cidade e o jeito de pedir.", "Texto dentro de imagem, banner ou vídeo não conta. Tente selecionar a frase com o dedo: se não seleciona, é imagem.", "Sem página para o serviço, marque essa resposta."] },
    "onde-geo-cadastros": { nome: "Google e Bing Places", olho: "Onde Conferir", nota: NOTA_GEO,
      exp: "O guia do Google para IA indica o Perfil da Empresa para negócio local. O Bing recomenda o Bing Places para manter endereço, horário e contato em dia, e ele importa os dados do Google.",
      passos: ["Procure a sua empresa no Google Maps.", "Procure a sua empresa no Bing Maps, em bing.com/maps.", "Para cadastrar no Bing, entre no Bing Places for Business e importe o Perfil do Google.", "O Apple Business põe a empresa nos Mapas da Apple. Ele informa, e não decide este ponto."] },
    "onde-geo-treino": { nome: "Robôs de Treino", olho: "Onde Conferir", nota: NOTA_GEO,
      exp: "Os robôs de treino decidem só se o conteúdo do site treina os modelos. O Google-Extended não tira o site da Pesquisa, e o Applebot-Extended não tira o site da busca da Apple.",
      passos: ["Abra o robots.txt do site.", "Procure Google-Extended, GPTBot, ClaudeBot e Applebot-Extended.", "Bloquear ou não é escolha da empresa. Não mexa nos robôs de busca por causa disso."] },
    "onde-geo-relatorio": { nome: "Relatório de IA no Search Console", olho: "Onde Conferir", nota: NOTA_GEO,
      exp: "O relatório de IA generativa mostra só as impressões do site nas Visões Gerais e no Modo IA, juntas. Os cliques ficam no relatório de Desempenho. Site com poucas impressões pode não ver o relatório.",
      passos: ["Entre no Search Console com a conta do site.", "Em Desempenho, abra o relatório de IA generativa. O nome em português pode ser outro.", "Escolha os três últimos meses completos. Hoje são {meses}.", "Veja se há impressões."] },
    "onde-geo-bing": { nome: "Citações no Copilot", olho: "Onde Conferir", nota: NOTA_GEO,
      exp: "O AI Performance, do Bing Webmaster Tools, mostra quantas vezes páginas do site foram citadas no Copilot e nos resumos de IA do Bing. Citação não é clique nem posição. O relatório está em prévia.",

    "geo-assistentes": { nome: "Onde Cada IA Busca", sub: "Um bloco por assistente", nota: NOTA_GEO,
      exp: "Cada assistente tem um robô de busca, que decide se o site entra nas respostas, e um robô de treino, que só decide se o conteúdo treina o modelo. Bloquear o treino não tira a empresa das respostas.",
      listaTitulo: "Por Assistente",
      lista: ["<b>Google (Visões Gerais, Modo IA e Gemini):</b> busca pelo Googlebot, com a mesma base do SEO. Treino pelo Google-Extended, que não tira o site da Pesquisa. Cadastro no Perfil da Empresa. Medição no relatório de IA generativa do Search Console.",
        "<b>ChatGPT:</b> busca pelo OAI-SearchBot e treino pelo GPTBot. Os links trazem utm_source=chatgpt.com, e o Analytics mostra essas visitas no canal Assistente de IA.",
        "<b>Copilot:</b> busca pela base do Bing, lida pelo Bingbot. Cadastro no Bing Places, que importa o Perfil do Google. Medição no AI Performance do Bing Webmaster Tools.",
        "<b>Perplexity:</b> busca pelo PerplexityBot. O Perplexity-User, que abre a página quando alguém pergunta, em geral não segue o robots.txt.",
        "<b>Claude:</b> busca pelo Claude-SearchBot e treino pelo ClaudeBot.",
        "<b>Siri e Apple:</b> busca pelo Applebot, que segue as regras do Googlebot quando não há regra própria. Treino pelo Applebot-Extended. Cadastro no Apple Business, para os Mapas."] },
    "geo-mitos": { nome: "O Que Não Precisa", sub: "Mitos sem fonte oficial", nota: NOTA_GEO,
      exp: "O guia do Google para IA, de maio de 2026, diz que a base é o SEO e lista o que não é preciso fazer. Nenhuma fonte oficial dos outros assistentes confirma os itens abaixo.",
      listaTitulo: "Sem Fonte Oficial",
      lista: ["Arquivo llms.txt: o Google diz que não usa. As outras empresas não publicaram regra sobre ele.",
        "Marcação especial para IA: o Google diz que não existe. Os dados estruturados só precisam bater com o que a página mostra.",
        "Marcação de perguntas frequentes para aparecer: o Google deixou de mostrar esse recurso em 2026.",
        "Texto picado ou reescrito só para IA: o guia do Google diz que não é preciso.",
        "Menções e links comprados: o guia do Google diz que ajudam menos do que parecem.",
        "Nome, endereço e telefone iguais em todos os diretórios: nenhuma fonte oficial de assistente diz que isso decide a citação.",
        "Pagar para aparecer: o Google diz que não há como pagar por posição melhor na busca local."] },
    "onde-aval-pedido": { nome: "Link de Avaliação", olho: "Onde Conferir", nota: NOTA_AVAL,

    "onde-aval-pratica": { nome: "O Que o Google Não Permite", olho: "Onde Conferir", nota: NOTA_AVAL,

    "onde-ponto-teste": { nome: "Teste do Contato", olho: "Onde Conferir", nota: NOTA_TESTE,

    "onde-indica-cinco": { nome: "Pedido a Todo Cliente", olho: "Onde Conferir",

    "onde-indica-chegaram": { nome: "Indicações Que Chegaram", olho: "Onde Conferir", nota: NOTA_INDICA,

      h += '<div class="res"><span class="num">' + n + "</span><span>" + NOME[n] + q("etapa-" + n, NOME[n]) + '</span><span class="pill ' + sit[1] + '">' + sit[0] + "</span></div>" + (f ? '<div class="falta">' + f + "</div>" : "");
    }
    return h;
  }

  function telaFinal(s) {
    var n = est.feitos.length, h;
    h = topo(s, "Resultado", "Seu Fluxo Adequado" + q("fluxo-adequado", "Fluxo Adequado"), n > 1 ? "Você percorreu " + n + " caminhos. Veja onde a sua empresa está e por onde começar." : "Onde a sua empresa está e por onde começar.");
    ["rn", "ex"].forEach(function (o) {
      var lista = feitosDe(o), d = FLUXO[o], meta = metaDe(o), hoje = num(est[o].hoje), todos, a, b, empate, tops, leitura, txt, adiantada, naMeta, px, i, k, l, tem, pend, at;
      if (!lista.length) return;
      todos = lista.map(function (c) { var m = medida(c); return { c: c, m: m, al: alcanceCanal(m), mes: o === "rn" ? num(P("rn", c.pilar).mes) : null }; });
      // A rota proposta começa pelo caminho de nível mais alto e, no empate de nível, pelo canal de pé até mais longe.
      // No empate de verdade, a escolha é do atendimento, e a ordem é a dos caminhos percorridos.
      todos.sort(function (x, y) { return (y.m.nivel - x.m.nivel) || (y.al - x.al); });
      a = todos[0]; b = todos[1] || null;
      empate = !!b && a.m.nivel === b.m.nivel && a.al === b.al;
      tops = empate ? todos.filter(function (x) { return x.m.nivel === a.m.nivel && x.al === a.al; }).slice(0, 2) : [a];
      // Passo da base da empresa (Etapas 1 e 2) é o mesmo para todos os caminhos: aparece uma vez.
      px = proximo(a.c, a.m);
      if (tops.length > 1 && px && px.n <= 2) tops = [a];
      if (!b) txt = "";
      else if (empate) txt = "Os caminhos estão empatados no nível e no canal. A escolha fica para o atendimento, com o mentor.";
      else if (a.m.nivel > b.m.nivel) txt = "Comece por <b>" + nomeCaminho(a.c) + "</b>. É o caminho de nível mais alto: está de pé até mais longe na rota. Completar um caminho inteiro vem antes de abrir outro.";
      else txt = "Os caminhos estão no mesmo nível. No canal, <b>" + nomeCaminho(a.c) + "</b> está de pé até mais longe, e a rota segue por ele.";
      adiantada = a.m.nivel >= 4; naMeta = hoje !== null && meta ? hoje >= meta : null;
      if (naMeta === null) leitura = ["Falta o Número", "Ainda não dá para dizer quanto o seu marketing gera, porque " + (hoje === null ? "o número de " + d.qtd[1] + " por mês não foi informado" : "ainda não existe uma meta mensal") + ". Não saber já é um resultado: o primeiro passo é registrar."];
      else if (adiantada && naMeta) leitura = ["Estrutura com Resultado", "O caminho está de pé e o número de " + d.qtd[1] + " está na meta. Para o atendimento: crescer no que funciona ou abrir um caminho novo?"];
      else if (adiantada) leitura = ["Estrutura sem Resultado", "O caminho está de pé, e o número de " + d.qtd[1] + " ainda não chegou à meta. Para o atendimento: o que explica a diferença?"];
      else if (naMeta) leitura = ["Resultado sem Estrutura", "O número de " + d.qtd[1] + " está na meta, mas o caminho ainda não está de pé. Para o atendimento: de onde vem esse resultado, e como fazer para ele se repetir?"];
      else leitura = ["Começo", "O caminho ainda não está de pé, e o número de " + d.qtd[1] + " está abaixo da meta. O próximo passo abaixo mostra por onde começar."];
      h += '<div class="blochead"><span class="bar"></span><span class="lbl">' + d.nome + "</span>" + (meta ? '<span class="bc">meta de ' + fmt(meta) + " por mês</span>" : "") + "</div>";
      // A barra das oito etapas: até onde a rota está de pé e onde você está.
      at = a.m.primeira;
      h += '<div class="passos" aria-hidden="true">';
      for (i = 1; i <= TOTAL; i++) h += '<span class="' + (!at || i < at ? "ok" : (i === at ? "at" : "")) + '"></span>';
      h += '</div><p class="aqui">' + (at ? "Você está na Etapa " + at + " de " + TOTAL + "." : "As oito etapas estão de pé.") + "</p>";
      // 01. Sua Meta
      h += '<div class="mom"><b>01</b> · Sua Meta</div><div class="lesson">';
      if (hoje !== null) {
        // A meta vem primeiro, para o título do bloco não cair sobre o número de hoje. O número de hoje diz a janela.
        h += '<div class="nums">' + (meta ? '<div class="m"><div class="v">' + fmt(meta) + '</div><div class="r">a sua meta por mês</div></div>' : "") + '<div><div class="v">' + fmt(hoje) + '</div><div class="r">' + d.qtd[1] + " por mês, na média dos últimos três meses" + (est[o].o_hoje === "e" ? " (estimativa)" : "") + "</div></div></div>";
        h += '<p style="text-align:center">' + (meta ? (hoje >= meta ? "<b>Você já está na meta.</b>" : "Faltam <b>" + plural(meta - hoje, d.qtd) + " por mês</b>.") : "Ainda não há meta mensal.") + "</p>";
      } else h += "<p>Você ainda não sabe o número de " + d.qtd[1] + " por mês." + (meta ? " A meta é " + fmt(meta) + " por mês." : "") + " Sem esse número, não dá para medir o avanço.</p>";
      h += "</div>";
      // 02. O Que Você Já Tem, no caminho por onde a rota segue ou, no empate de verdade, no primeiro que o aluno percorreu
      tem = [];
      for (k = 1; k <= TOTAL; k++) { l = temEtapa(k, a.c, a.m.v); if (l) tem.push(l); }
      h += '<div class="mom"><b>02</b> · O Que Você Já Tem</div><div class="lesson">' + (todos.length > 1 ? "<p>No caminho <b>" + nomeCaminho(a.c) + "</b>, " + (empate ? "o primeiro que você percorreu" : "por onde a rota segue") + ":</p>" : "");
      h += tem.length ? '<p><b>Você já começou.</b></p><ul class="tem"><li>' + tem.join("</li><li>") + "</li></ul>" : "<p>Ainda não há etapa de pé nem em parte. O próximo passo mostra por onde começar.</p>";
      h += '<div class="rodape"><span class="pill soon">Nível ' + a.m.nivel + " de 5 · " + NIVEL[a.m.nivel].nome + "</span><span>" + contaEtapas(a.m) + "</span>" + q("niveis", "o nível") + "</div></div>";
      // 03. O Que Pede Atenção: as três primeiras etapas que não estão de pé, na ordem da rota
      pend = [];
      for (k = 1; k <= TOTAL; k++) if (a.m.v[k] !== 2) pend.push(k);
      h += '<div class="mom"><b>03</b> · O Que Pede Atenção</div><div class="lesson">';
      if (!pend.length) h += "<p>Nenhuma etapa pede atenção agora.</p>";
      pend.slice(0, 3).forEach(function (e, j) { h += '<div class="aten"><div><b>' + nomeDono(e, a.c) + '</b><span class="t">' + faltaCurta(e, a.c, a.m.v) + "</span></div>" + (j === 0 ? '<span class="pill now">comece aqui</span>' : "") + "</div>"; });
      if (pend.length > 3) h += '<div class="outnote">Mais ' + (pend.length - 3) + (pend.length - 3 === 1 ? " ponto" : " pontos") + " no diagnóstico completo.</div>";
      h += "</div>";
      // 04. Seu Próximo Passo, o único destaque, com a comparação entre caminhos quando houver
      h += '<div class="mom"><b>04</b> · Seu Próximo Passo</div>';
      tops.forEach(function (x, j) { h += cartaoPasso(x.c, x.m, todos.length > 1 ? nomeCaminho(x.c) : "", j === 0 ? txt : "", true); });
      // Meu Diagnóstico Completo: o detalhe fica guardado, a um toque
      h += '<details class="camada"><summary>Meu Diagnóstico Completo</summary>';
      if (o === "rn") h += "<h4>Origem dos Clientes</h4>" + mapaOrigem(lista, hoje, meta);
      h += "<h4>" + (todos.length > 1 ? "Os Caminhos Percorridos" : "O Caminho Percorrido") + "</h4>";
      todos.forEach(function (x) {
        var ind = x === a && !!b && !empate, sit = situacao(3, x.c, x.m.v);
        h += "<p><b>" + nomeCaminho(x.c) + "</b>" + (ind ? ' <span class="pill now">comece por este</span>' : "") + '<br><span class="outnote">Nível ' + x.m.nivel + ": " + NIVEL[x.m.nivel].nome + " · " + (o === "rn" ? "canal" : "ação") + ": " + sit[0] + " · " + contaEtapas(x.m) + (o === "rn" ? " · " + PILAR[x.c.pilar].nome + ": " + (x.mes !== null ? fmt(x.mes) + (hoje !== null ? " de " + fmt(hoje) + " clientes" : (x.mes === 1 ? " cliente" : " clientes")) + " por mês" : "origem não levantada") : "") + "</span></p>";
      });
      h += "<h4>As Oito Etapas</h4>" + (lista.length > 1 ? '<p class="outnote">As Etapas 1 e 2 são da empresa e valem para todos os caminhos.</p>' : "") + etapasCompletas(a.c, a.m);
      h += "<p>Leitura das duas medidas: <b>" + leitura[0] + "</b>. " + leitura[1] + "</p>";
      h += '<div class="outnote">Como o app chega a isto: a rota começa pelo caminho de nível mais alto e, no empate, pelo que está de pé até mais longe no canal. O resultado é a média mensal dos últimos três meses, e está na meta quando alcança a meta que você definiu. A estrutura está adiantada a partir do nível Captação, quando os contatos passam a ficar registrados no CRM. A rota é proposta: você e o mentor confirmam no atendimento. No próximo ciclo de 90 dias, você mede de novo.</div>';
      h += "</details>";
    });
    h += '<button type="button" class="btn outline" data-go="#/d/1">Avaliar outro caminho</button>';
    h += '<button type="button" class="btn ghost" data-go="#/">Voltar à Jornada</button>';
    h += '<p class="scrimline">No aplicativo, o mentor recebe o diagnóstico completo e confirma o próximo passo no atendimento, antes de ele entrar no Plano de 90 Dias.</p>';
    return h;
  }

  function telaBiblioteca(s) {
    var h = topo(s, "Biblioteca", "Pilares e Canais", "Toque em qualquer item para ver a explicação e as dicas. Aqui não há nota.");
    ORDEM.forEach(function (p) {
      h += '<div class="lesson"><h3>' + PILAR[p].nome + q(p, PILAR[p].nome) + "</h3><p>" + LEIGO[p] + '</p><div class="chips" style="margin-top:10px">';
      PILAR[p].canais.forEach(function (c) {
        h += '<button type="button" class="chip" data-termo="' + c + '">' + CANAL[c].nome + '<span class="qi" aria-hidden="true">?</span></button>';
      });
      h += "</div></div>";
    });
    return h;
  }

  function desenhar(manter) {
    var s = ler(), h;
    if (s.tela === "home") h = telaHome();
    else if (s.tela === "inicio") h = telaInicio(s);
    else if (s.tela === "biblioteca") h = telaBiblioteca(s);
    else if (s.tela === "fim") h = telaFim(s);
    else if (s.tela === "final") h = telaFinal(s);
    else h = telaEtapa(s);
    main.innerHTML = h;
    if (manter !== true) window.scrollTo(0, 0);
  }
  // Atualiza só a leitura e o botão de avançar, sem tirar o cursor do campo que o aluno está preenchendo.
  function pintarEtapa() {
    var s = ler(), d = document.getElementById("dev"), av = document.getElementById("av");
    if (s.tela !== "etapa") return;
    if (d) d.innerHTML = devolutiva(s.etapa, atual());
    if (av) av.innerHTML = rodape(s);
  }
  function rolar(id, perto) {
    var e = document.getElementById(id);
    if (e && e.scrollIntoView) e.scrollIntoView({ behavior: "smooth", block: perto ? "nearest" : "start" });
  }
  // Reescreve o campo com a máscara e devolve o cursor ao mesmo ponto, contando os algarismos à esquerda dele.
  function aplicarMascara(g) {
    var antes = g.value, novo = mascara(antes, parseInt(g.getAttribute("data-dec"), 10) || 0), pos = g.selectionStart, n, i, k;
    if (novo === antes) return;
    n = typeof pos === "number" ? antes.slice(0, pos).replace(/[^\d,]/g, "").length : -1;
    g.value = novo;
    if (n < 0 || !g.setSelectionRange) return;
    for (i = 0, k = 0; i < novo.length && k < n; i++) if (/[\d,]/.test(novo.charAt(i))) k++;
    try { g.setSelectionRange(i, i); } catch (e) {}
  }
  // Onde fica guardado o número de um campo, conforme o grupo dele.
  function guardar(grupo, id, v) {
    if (grupo === "tk") est.ticket = v;
    else if (grupo === "num") F()[id] = v;
    else if (grupo === "pl") P(est.obj, A().pilar)[id] = v;
    else A().num[id] = v;
  }

  document.addEventListener("click", function (ev) {
    var t = ev.target, a, m;
    if (!t.closest) return;
    if (t.id === "scrim" || t.closest("#folha-ok")) { fecharTermo(); return; }
    a = t.closest("[data-termo]");
    if (a) { ev.preventDefault(); abrirTermo(a.getAttribute("data-termo"), a); return; }
    if (t.closest("[data-zerar]")) { zerar(); return; }
    a = t.closest("[data-acao]");
    if (a) { m = a.getAttribute("data-acao"); concluir(); ir(m === "outro" ? "#/d/1" : "#/d/final"); return; }
    a = t.closest("[data-go]");
    if (a) { ev.preventDefault(); ir(a.getAttribute("data-go")); return; }
    a = t.closest("[data-obj]");
    if (a) { escolherObj(a.getAttribute("data-obj")); desenhar(true); rolar("painel"); return; }
    if (!est.obj) return;
    a = t.closest("[data-pilar]");
    if (a) { escolherPilar(a.getAttribute("data-pilar")); desenhar(true); rolar("painel"); return; }
    a = t.closest("[data-canal]");
    if (a) { escolherCanal(a.getAttribute("data-canal")); desenhar(true); rolar("painel"); return; }
    a = t.closest("[data-op]");
    if (a) { A().esc = a.getAttribute("data-op"); desenhar(true); rolar("av", true); return; }
    a = t.closest("[data-item]");
    if (a) { m = a.getAttribute("data-item").split("|"); if (m[0].charAt(0) === "@") F()[m[0].slice(1)] = m[1]; else A().num[m[0]] = m[1]; desenhar(true); rolar("av", true); return; }
    a = t.closest("[data-mot]");
    if (a) { A().num.motivo = a.getAttribute("data-mot"); desenhar(true); rolar("av", true); return; }
    a = t.closest("[data-org]");
    if (a) { m = a.getAttribute("data-org").split("|"); lugar(m[0])["o_" + m[1]] = m[2]; desenhar(true); rolar("av", true); return; }
    a = t.closest("[data-resp]");
    if (a) {
      m = parseInt(a.getAttribute("data-etapa"), 10);
      A().resp[m] = parseInt(a.getAttribute("data-resp"), 10);
      if (!A().opc) A().opc = {};
      A().opc[m] = parseInt(a.getAttribute("data-opc"), 10);
      delete A().herd[m];
      desenhar(true); rolar("av", true);
    }
  });
  var GRUPOS = ["tk", "num", "pl", "cm"];
  main.addEventListener("input", function (ev) {
    var g = ev.target.getAttribute ? ev.target : null, i, c;
    if (!g || !est.obj) return;
    for (i = 0; i < GRUPOS.length; i++) {
      c = g.getAttribute("data-" + GRUPOS[i]);
      if (c) { aplicarMascara(g); guardar(GRUPOS[i], c, lerNumero(g.value)); pintarEtapa(); return; }
    }
  });
  main.addEventListener("change", function (ev) {
    var g = ev.target.getAttribute ? ev.target : null, i, c, e;
    if (!g || !est.obj) return;
    for (i = 0; i < GRUPOS.length; i++) {
      c = g.getAttribute("data-" + GRUPOS[i] + "-ns");
      if (!c) continue;
      guardar(GRUPOS[i], c, g.checked ? "ns" : null);
      // A marca de origem aparece ou some conforme o número é ou não acompanhado: a tela é redesenhada.
      desenhar(true);
      return;
    }
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !folha.hidden) fecharTermo(); });
  window.addEventListener("popstate", function (ev) {
    rota = (ev.state && ev.state.r) || (location.hash && location.hash.length > 1 ? location.hash : "#/");
    desenhar();
  });

  // ?e=<respostas em JSON> abre o exemplo no ponto exato de um preenchimento, e ?termo=<id> abre uma explicação.
  var me = extra.match(/(^|&)e=([^&]+)/);
  if (me) {
    try {
      var oe = JSON.parse(decodeURIComponent(me[2])), ke, k2;
      for (ke in oe) {
        if (ke === "rn" || ke === "ex" || ke === "at") { for (k2 in oe[ke]) est[ke][k2] = oe[ke][k2]; }
        else if (ke === "pil") { est.pil = { rn: oe.pil.rn || {}, ex: oe.pil.ex || {} }; }
        else est[ke] = oe[ke];
      }
      est.feitos.forEach(function (c) { c.resp = c.resp || {}; c.opc = c.opc || {}; c.num = c.num || {}; });
      est.at.opc = est.at.opc || {};
    } catch (erro) {}
  }
  desenhar();
  var mt = extra.match(/(^|&)termo=([a-z0-9-]+)/);
  if (mt) abrirTermo(mt[2], null);
})();
</script>
